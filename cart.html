<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>购物车 · 智选云 AI</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/ui.js"></script>
</head>
<body>

<div id="header-root"></div>
<script>AIECP.UI.renderHeader('cart');</script>

<div class="container">
  <div class="crumb">
    <a href="index.html">首页</a><span class="sep">/</span><span>购物车</span>
  </div>

  <div class="section-head">
    <div>
      <h2 class="section-title">🛒 我的购物车</h2>
      <div class="section-sub">支持数量修改、勾选结算与失效商品提示（FR-03）</div>
    </div>
    <button class="btn btn-sm" onclick="AIECP.Pages.cart.clearInvalid()" id="clearInvalidBtn">清除失效商品</button>
  </div>

  <div class="cart-wrap">
    <div class="cart-head">
      <span><input type="checkbox" id="chkAllTop"></span>
      <span>商品信息</span>
      <span>单价</span>
      <span>数量</span>
      <span>小计</span>
      <span>操作</span>
    </div>
    <div id="cartBody"></div>
  </div>

  <div class="cart-bar mt16">
    <div class="row center between wrap" style="padding:14px 4px">
      <label class="row center gap8">
        <input type="checkbox" id="chkAllBottom"> <span class="small text-2">全选</span>
      </label>
      <button class="btn btn-sm" onclick="AIECP.Pages.cart.removeChecked()">删除选中</button>
      <div class="cart-summary">
        <span class="cs-line">已选 <b id="selCount">0</b> 件</span>
        <span class="cs-line">商品金额 <b class="text-price" id="goodsAmount">¥0.00</b></span>
        <span class="cs-total">合计 <span class="price" id="totalAmount">¥0.00</span></span>
        <button class="btn btn-lg btn-danger" onclick="AIECP.Pages.cart.checkout()">去结算</button>
      </div>
    </div>
  </div>

  <!-- ============ AI 智能组货：基于购物车的补充推荐 ============ -->
  <div class="section">
    <div class="ai-panel">
      <div class="ai-panel-head">
        <div class="aph-icon">🎯</div>
        <div>
          <h3>智能选品 · 购物车还能搭点什么</h3>
          <div class="aph-sub" id="cartRecSub">基于购物车场景上下文的多路召回结果</div>
        </div>
        <div class="aph-right" id="cartRecTrace"></div>
      </div>
      <div class="ai-panel-body"><div class="product-grid cols-5" id="cartRecGrid"></div></div>
    </div>
  </div>
</div>

<div id="footer-root"></div>
<div id="mt-root"></div>
<script>AIECP.UI.tail();</script>
<script src="assets/js/cart.js"></script>
</body>
</html>
