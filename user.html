<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人中心 · 智选云 AI</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/ui.js"></script>
</head>
<body>

<div id="header-root"></div>
<script>AIECP.UI.renderHeader('user');</script>

<div class="container">
  <div class="crumb">
    <a href="index.html">首页</a><span class="sep">/</span><span>个人中心</span>
  </div>

  <div class="profile-layout">
    <!-- ==================== 侧栏 ==================== -->
    <aside>
      <div class="user-card">
        <div class="uc-top">
          <div class="avatar" id="ucAvatar">夏</div>
          <div>
            <div style="font-size:16px;font-weight:600" id="ucName"></div>
            <div class="small" style="opacity:.9" id="ucLevel"></div>
          </div>
        </div>
        <div class="uc-stats">
          <div><b id="ucOrders">0</b><span>全部订单</span></div>
          <div><b id="ucCoupons">0</b><span>优惠券</span></div>
          <div><b id="ucPoints">0</b><span>积分</span></div>
        </div>
      </div>
      <div class="side-nav">
        <a href="#overview" class="active" data-tab="overview">📊 账户概览</a>
        <a href="#profile" data-tab="profile">🧠 我的 AI 画像</a>
        <a href="#footprint" data-tab="footprint">👣 浏览足迹</a>
        <a href="#fav" data-tab="fav">❤️ 我的收藏</a>
        <a href="#address" data-tab="address">📍 地址管理</a>
        <a href="#coupon" data-tab="coupon">🎟️ 我的优惠券</a>
        <a href="#aisetting" data-tab="aisetting">⚙️ AI 能力与降级</a>
      </div>
      <div class="card card-pad mt16">
        <div class="block-title">商家入口</div>
        <a class="btn btn-sm btn-block btn-ai" href="category-import.html">JSON 品类定义导入</a>
        <p class="small text-3 mt8">新增经营品类无需发版，粘贴 JSON 即可生成品类树、属性 Schema、动态表单与检索索引映射。</p>
      </div>
    </aside>

    <!-- ==================== 主区 ==================== -->
    <div id="profileMain"></div>
  </div>
</div>

<div id="footer-root"></div>
<div id="mt-root"></div>
<script>AIECP.UI.tail();</script>
<script src="assets/js/user.js"></script>
</body>
</html>
