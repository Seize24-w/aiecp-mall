<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>结算下单 · 智选云 AI</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/ui.js"></script>
</head>
<body>

<div id="header-root"></div>
<script>AIECP.UI.renderHeader('cart');</script>

<div class="container">
  <div class="crumb">
    <a href="index.html">首页</a><span class="sep">/</span>
    <a href="cart.html">购物车</a><span class="sep">/</span><span>确认订单</span>
  </div>

  <h2 class="section-title mb16">📝 确认订单</h2>

  <div class="checkout-layout">
    <div>
      <!-- ==================== 收货地址 ==================== -->
      <div class="card card-pad mb16">
        <div class="block-title">📍 收货地址
          <button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="AIECP.Pages.checkout.toggleAddrForm()">+ 新增地址</button>
        </div>
        <div class="addr-list" id="addrList"></div>
        <div class="card mt16 hide" id="addrForm" style="box-shadow:none;border:1px solid var(--line)">
          <div class="card-pad">
            <div class="form-grid">
              <div class="field"><label>收货人</label><input id="afName" placeholder="如：夏小雨"></div>
              <div class="field"><label>手机号</label><input id="afMobile" placeholder="如：138****6021"></div>
            </div>
            <div class="field"><label>所在地区</label><input id="afRegion" placeholder="如：浙江省 杭州市 余杭区"></div>
            <div class="field"><label>详细地址</label><input id="afDetail" placeholder="街道、门牌号、楼层等"></div>
            <div class="row gap8">
              <button class="btn btn-primary btn-sm" onclick="AIECP.Pages.checkout.saveAddr()">保存地址</button>
              <button class="btn btn-sm" onclick="AIECP.Pages.checkout.toggleAddrForm()">取消</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== 商品清单 ==================== -->
      <div class="card card-pad mb16">
        <div class="block-title">🛍️ 商品清单 <span class="text-3 small" id="itemCountText"></span></div>
        <div class="checkout-items" id="coItems"></div>
      </div>

      <!-- ==================== 优惠券 ==================== -->
      <div class="card card-pad mb16">
        <div class="block-title">🎟️ 优惠券
          <span class="text-3 small" style="margin-left:auto">每个订单可使用 1 张，可与平台满减叠加</span>
        </div>
        <div class="coupon-list" id="couponList"></div>
      </div>

      <!-- ==================== 支付方式 ==================== -->
      <div class="card card-pad mb16">
        <div class="block-title">💳 支付方式</div>
        <div class="pay-methods" id="payMethods">
          <div class="pay-method active" data-pay="微信支付">🟢 微信支付</div>
          <div class="pay-method" data-pay="支付宝">🔵 支付宝</div>
          <div class="pay-method" data-pay="云闪付">🟡 云闪付</div>
          <div class="pay-method" data-pay="银行卡">💳 银行卡</div>
        </div>
        <div class="field mt16"><label>订单备注（选填）</label>
          <input id="remarkInput" placeholder="如：工作日 18:00 后配送 / 需要开发票"></div>
      </div>
    </div>

    <!-- ==================== 金额明细 ==================== -->
    <aside class="card card-pad summary-box">
      <div class="block-title">💰 金额明细</div>
      <div class="summary-line"><span>商品金额</span><span id="sumGoods">¥0.00</span></div>
      <div class="summary-line"><span>优惠券</span><span class="text-price" id="sumCoupon">-¥0.00</span></div>
      <div class="summary-line"><span>运费</span><span id="sumFreight">¥0.00</span></div>
      <div class="summary-line"><span>会员积分抵扣</span><span id="sumPoints">-¥0.00</span></div>
      <div class="summary-line total"><span>应付金额</span><span class="price" id="sumTotal">¥0.00</span></div>
      <div class="small text-3 mt8" id="saveText"></div>
      <button class="btn btn-lg btn-danger btn-block mt16" onclick="AIECP.Pages.checkout.submit()">提交订单</button>
      <div class="small text-3 mt8" style="line-height:1.7">
        提交后库存即被锁定，请在 30 分钟内完成支付；超时订单将自动关闭并释放库存。
        支付回调须验签且幂等（BR-08）。
      </div>
    </aside>
  </div>
</div>

<div id="footer-root"></div>
<div id="mt-root"></div>
<script>AIECP.UI.tail();</script>
<script src="assets/js/checkout.js"></script>
</body>
</html>
